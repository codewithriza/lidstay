name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lifecycle:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash -n bin/lidstay
      - run: python3 -m unittest discover -s tests -v
